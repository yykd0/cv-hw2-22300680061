seed: 42
task: pet_classification
output_dir: runs/task1_resnet18_scratch
data:
  root: data/oxford_iiit_pet
  val_ratio: 0.15
  image_size: 224
  num_workers: 4
  download: true
model:
  arch: resnet18
  pretrained: false
  attention: none
  num_classes: 37
train:
  epochs: 40
  batch_size: 32
  optimizer: adamw
  lr_backbone: 0.0003
  lr_head: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  amp: true
logging:
  backend: csv
  project: cv-hw2-task1
  run_name: resnet18-scratch

